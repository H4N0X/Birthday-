<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>رسالة من القلب ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="heart-screen">

        <div class="page-content">

            <p class="chapter">CHAPTER 05</p>

            <h1>في حاجة عايز القلب يقولها ❤️</h1>

            <p class="description">
                اضغطي على القلب 3 مرات،
                وشوفي كل ضغطة هتقول إيه.
            </p>

            <button
                id="bigHeart"
                class="big-heart"
                onclick="clickHeart()"
                aria-label="اضغطي على القلب">

                ❤️

            </button>

            <p id="heartMessage" class="heart-message">
                مستعدة؟ اضغطي على القلب...
            </p>

            <p id="heartProgress">
                0 / 3
            </p>

            <button
                id="nextHeartButton"
                class="main-button"
                onclick="goToGame()"
                hidden>

                يلا نلعب 🎮

            </button>

        </div>

    </main>

    <script src="script.js"></script>

</body>

</html>
