<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>أسرار النجوم ⭐</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="secrets-screen">

        <div class="page-content">

            <p class="chapter">CHAPTER 04</p>

            <h1>في نجوم مخبية ليكي أسرار ⭐</h1>

            <p class="description">
                كل نجمة وراها رسالة صغيرة...
                جربي تكتشفيهم كلهم.
            </p>

            <div class="stars-grid">

                <button class="secret-star"
                    onclick="revealSecret(0, this)">
                    ✦
                </button>

                <button class="secret-star"
                    onclick="revealSecret(1, this)">
                    ✧
                </button>

                <button class="secret-star"
                    onclick="revealSecret(2, this)">
                    ★
                </button>

                <button class="secret-star"
                    onclick="revealSecret(3, this)">
                    ✦
                </button>

                <button class="secret-star"
                    onclick="revealSecret(4, this)">
                    ✧
                </button>

            </div>

            <div id="secretMessage" class="secret-message">
                اختاري نجمة عشان تكتشفي أول سر ✨
            </div>

            <p id="secretProgress">
                الأسرار المكتشفة: 0 / 5
            </p>

            <button
                id="nextSecretButton"
                class="main-button"
                onclick="goToHeart()"
                hidden>

                في حاجة تانية مستنياكي ❤️

            </button>

        </div>

    </main>

    <script src="script.js"></script>

</body>

</html>
