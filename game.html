<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تحدي النجوم ⭐</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game-screen">

        <div class="page-content">

            <p class="chapter">CHAPTER 06</p>

            <h1>تحدي النجوم ⭐</h1>

            <p class="description">
                اجمعي 8 نجوم قبل انتهاء الوقت
                عشان توصلي للمفاجأة الأخيرة!
            </p>

            <div class="game-stats">

                <div class="stat-card">
                    <span>النجوم</span>
                    <strong id="score">0 / 5</strong>
                </div>

                <div class="stat-card">
                    <span>الوقت</span>
                    <strong id="timer">30</strong>
                </div>

            </div>

            <div id="gameArea" class="game-area">

                <div id="gameIntro" class="game-intro">

                    <span class="intro-star">✦</span>

                    <p>
                        مستعدة للتحدي؟
                    </p>

                    <button
                        id="startGameButton"
                        class="main-button"
                        onclick="startGame()">

                        ابدئي اللعب 🎮

                    </button>

                </div>

            </div>

            <p id="gameMessage" class="game-message">
                اضغطي على النجوم واجمعي 5 نقاط!
            </p>

            <button
                id="retryButton"
                class="main-button"
                onclick="startGame()"
                hidden>

                حاولي تاني 🔄

            </button>

            <button
                id="finalGameButton"
                class="main-button"
                onclick="goToFinal()"
                hidden>

                افتحي هديتك الأخيرة 🎁

            </button>

        </div>

    </main>

    <script src="script.js"></script>

</body>

</html>
