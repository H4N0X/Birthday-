
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>أربع سنين من الحكاية 🕰️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="years-screen">

        <div class="page-content">

            <p class="chapter">CHAPTER 03</p>

            <h1>أربع سنين... وأربع حكايات</h1>

            <p class="description">
                كل سنة كان ليها حكاية مختلفة.
                اختاري كل محطة واكتشفي اللي جواها ✨
            </p>

            <div class="years-grid">

                <button class="year-card"
                    onclick="openYear(1, this)">

                    <span class="year-number">01</span>
                    <span class="year-title">البداية</span>
                    <span class="year-hint">أول صفحة في الحكاية</span>

                    <p class="year-story">
                        كل حكاية حلوة بيكون ليها بداية،
                        وأجمل حاجة في البداية إننا منعرفش
                        الذكريات اللي مستنيانا.
                    </p>

                </button>

                <button class="year-card"
                    onclick="openYear(2, this)">

                    <span class="year-number">02</span>
                    <span class="year-title">الذكريات</span>
                    <span class="year-hint">تفاصيل مبتتنسيش</span>

                    <p class="year-story">
                        ساعات أبسط التفاصيل هي اللي بتفضل
                        في بالنا، وتخلينا نبتسم لما نفتكرها.
                    </p>

                </button>

                <button class="year-card"
                    onclick="openYear(3, this)">

                    <span class="year-number">03</span>
                    <span class="year-title">التغيير</span>
                    <span class="year-hint">حاجات اتعلمناها</span>

                    <p class="year-story">
                        مع الوقت بنتغير ونتعلم،
                        وكل تجربة بتسيب جوانا حاجة جديدة.
                    </p>

                </button>

                <button class="year-card"
                    onclick="openYear(4, this)">

                    <span class="year-number">04</span>
                    <span class="year-title">اللي جاي</span>
                    <span class="year-hint">لسه في فصول كتير</span>

                    <p class="year-story">
                        أجمل حاجة إن الحكاية لسه مستمرة،
                        ولسه في ذكريات جديدة ممكن نصنعها.
                    </p>

                </button>

            </div>

            <p id="yearsProgress">
                اكتشفي المحطات الأربعة: 0 / 4
            </p>

            <button
                id="nextYearsButton"
                class="main-button"
                onclick="goToSecrets()"
                hidden>

                اكتشفي الأسرار ⭐

            </button>

        </div>

    </main>

    <script src="script.js"></script>

</body>

</html>
